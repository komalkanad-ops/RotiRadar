name: CI

# Safety net, not a deploy pipeline. Deploy flow:
#   - web/ and admin-console/  -> Hostinger static-site Git import from `main`
#   - backend/                 -> `git subtree split --prefix=backend -b backend-root` then force-push
# This just gates every push/PR with typecheck + build so a broken tree never reaches those imports.
on:
  push:
    branches: ["**"]
  pull_request:

# Several quick pushes to a branch shouldn't stack N full runs — keep only the newest per ref.
# main is exempt: every commit there deserves its own recorded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # tsc alone won't catch a Vite-specific failure (asset/import resolution) — `npm run build`
      # is what the Hostinger static-site import runs, so that's what CI verifies.
      - run: npm run build

  admin-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-console/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # `postinstall` runs `prisma generate && prisma migrate deploy && npm run build` — that's the
    # Hostinger Node-deploy hook and needs a live DB, so `npm ci` is run with --ignore-scripts here
    # and each step is invoked explicitly. A dummy DATABASE_URL satisfies schema validation; nothing
    # in this job actually connects.
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/rotiradar_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run build
      # TODO(phase-1): once prisma/migrations/ exists, add a real mysql service + `prisma migrate
      # deploy` to test the migration history from scratch, and `npm test` once a module has tests.
