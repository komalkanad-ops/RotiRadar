name: CI

# Safety net, not a deploy pipeline. Deploy flow:
#   - web/ and admin-console/  -> Hostinger static-site Git import from `main`
#   - backend/                 -> `git subtree split --prefix=backend -b backend-root` then force-push
# This just gates every push/PR with typecheck + build so a broken tree never reaches those imports.
on:
  push:
    branches: ["**"]
  pull_request:

# Several quick pushes to a branch shouldn't stack N full runs — keep only the newest per ref.
# main is exempt: every commit there deserves its own recorded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # tsc alone won't catch a Vite-specific failure (asset/import resolution) — `npm run build`
      # is what the Hostinger static-site import runs, so that's what CI verifies.
      - run: npm run build

  admin-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-console/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rotiradar_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    # `postinstall` runs `prisma generate && prisma migrate deploy && npm run build` — that's the
    # Hostinger Node-deploy hook, so `npm ci` is run with --ignore-scripts here and each step is
    # invoked explicitly against the throwaway `mysql` service above instead.
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/rotiradar_ci
      JWT_SECRET: ci-test-secret-not-for-production-but-long-enough
      ADMIN_BOOTSTRAP_EMAIL: admin@rotiradar.in
      ADMIN_BOOTSTRAP_PASSWORD: ci-test-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      # Real integration test of the migration history itself — builds the whole schema from
      # scratch against a fresh database, the same way a brand-new environment would.
      - run: npx prisma migrate deploy
      # Several tests (bookings' pricing calc especially) depend on the catalog/config rows a real
      # environment always has via `npm run seed` — without this, Service/AppConfig are empty on
      # this fresh DB and booking creation 400s ("service tier isn't available").
      - run: npm run seed
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
