<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>RotiRadar</title>
  <rect width="40" height="40" rx="11" fill="#BC401A" />
  <!-- radar range rings over a roti -->
  <circle cx="20" cy="20" r="11" stroke="#FCF8F3" stroke-opacity="0.45" stroke-width="1.4" />
  <circle cx="20" cy="20" r="6.5" stroke="#FCF8F3" stroke-opacity="0.7" stroke-width="1.4" />
  <!-- sweep -->
  <path d="M20 20 L20 8.5 A11.5 11.5 0 0 1 29 13 Z" fill="#FCF8F3" fill-opacity="0.9" />
  <circle cx="20" cy="20" r="2.4" fill="#FCF8F3" />
</svg>
